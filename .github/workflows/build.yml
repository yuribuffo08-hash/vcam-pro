name: Build VCamPro

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    # macOS runner: only Apple's real toolchain emits a valid arm64e slice
    # (with correct Pointer Authentication) that iOS 17 can dlopen AND execute.
    # The Linux/Theos toolchain produces an arm64e slice that loads but crashes
    # at runtime on A12+ devices -> Preferences.app crash when opening the panel.
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Install packaging tools
        run: |
          brew install dpkg ldid xz

      - name: Setup Theos and SDKs
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          cp -r /tmp/sdks/*.sdk $THEOS/sdks/
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Compile Debian Package
        run: |
          export THEOS=$HOME/theos
          chmod +x layout/DEBIAN/postinst || true
          make clean
          make package FINALPACKAGE=1

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCamPro-DEB
          path: packages/*.deb
